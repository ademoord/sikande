<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Apply the saved theme as early as possible to avoid a flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
    <link rel="icon" type="image/x-icon" href="/static/images/logo-S-big-transparent.ico">
    <title>{{ title }} - Sikande</title>
  </head>
  <body>
    {% if current_user.is_authenticated %}
    {% include 'nav.html' %}
    {% endif %}
    {% block content %}{% endblock %}
    {% include 'foo.html' %}
    {% include 'scripts.html' %}
    <script>
      // Theme toggle: self-contained so it works even if other page scripts error out.
      (function () {
        function currentTheme() {
          return document.documentElement.getAttribute('data-theme') || 'light';
        }
        function syncToggle(theme) {
          var icon = document.getElementById('themeIcon');
          var label = document.querySelector('.theme-toggle-label');
          var isDark = theme === 'dark';
          if (icon) {
            icon.classList.toggle('fa-sun', isDark);
            icon.classList.toggle('fa-moon', !isDark);
          }
          if (label) {
            label.textContent = isDark ? 'Light' : 'Dark';
          }
        }
        function applyTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
          syncToggle(theme);
        }
        document.addEventListener('DOMContentLoaded', function () {
          syncToggle(currentTheme());
          var toggle = document.getElementById('themeToggle');
          if (toggle) {
            toggle.addEventListener('click', function (e) {
              e.preventDefault();
              applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
            });
          }
        });
      })();
    </script>
  </body>
</html>
