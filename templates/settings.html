{% extends "base.html" %}

{% block content %}
<style>
    /* Sidebar styling */
    .sidebar {
        width: 250px;
        height: 100vh;
        background-color: #343a40;
        color: white;
        padding: 20px;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }

    .sidebar h3 {
        font-size: 1.5rem;
        margin-bottom: 30px;
    }

    .sidebar button {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: none;
        background-color: #007bff;
        color: white;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }

    .sidebar button:hover {
        background-color: #0056b3;
    }

    /* Main content styling */
    .main-content {
        margin-left: 270px;
        padding: 20px;
        height: 100vh;
        background-color: #f8f9fa;
    }

    .main-content h1 {
        font-size: 2rem;
        margin-bottom: 20px;
    }

</style>

<!-- Sidebar -->
<div class="sidebar">
    <h3>Settings</h3>
    <form method="POST" action="/backup">
        <button type="submit">Backup All Data</button>
    </form>
    <form method="POST" action="/truncate">
        <button type="submit">Truncate Item Data</button>
    </form>
</div>

<!-- Main content -->
<div class="main-content">
    <h1>Welcome to the Settings Page</h1>
    <p>Here you can backup or truncate data in your database.</p>
</div>
{% endblock %}
