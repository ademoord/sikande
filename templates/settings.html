{% extends "base.html" %}

{% block content %}
<div class="content-card" style="max-width: 720px;">
  <div class="content-card-header">
    <h2>Settings</h2>
  </div>
  <p style="color: var(--muted); margin-top: -6px;">Backup or maintain your database.</p>

  <div class="stat-grid" style="margin-top: 18px;">
    <div class="stat-card" style="flex-direction: column; align-items: flex-start; gap: 14px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="stat-icon"><i class="fas fa-database"></i></div>
        <div class="stat-meta">
          <div class="stat-value" style="font-size:1.05rem;">Backup Data</div>
          <div class="stat-label">Download a full SQL dump.</div>
        </div>
      </div>
      <form method="POST" action="/backup" style="width:100%;">
        <button type="submit" class="btn-gold" style="width:100%; justify-content:center;">
          <i class="fas fa-download"></i> Backup All Data
        </button>
      </form>
    </div>

    <div class="stat-card" style="flex-direction: column; align-items: flex-start; gap: 14px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="stat-icon" style="background: rgba(205,92,92,0.15); color:#cd5c5c;"><i class="fas fa-trash-alt"></i></div>
        <div class="stat-meta">
          <div class="stat-value" style="font-size:1.05rem;">Truncate Items</div>
          <div class="stat-label">Remove all item records.</div>
        </div>
      </div>
      <form method="POST" action="/truncate" style="width:100%;"
            onsubmit="return confirm('This will delete ALL item records. Continue?');">
        <button type="submit" class="btn-outline" style="width:100%;">
          <i class="fas fa-trash-alt"></i> Truncate Item Data
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
