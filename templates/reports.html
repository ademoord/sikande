{% extends "base.html" %}

{% block content %}
<div class="content-card">
  <div class="content-card-header">
    <h2>Daftar Pengeluaran</h2>
    <a href="/input" class="btn-gold"><i class="fas fa-plus"></i> Input Baru</a>
  </div>
  <div class="table-responsive">
    {% include 'table.html' %}
  </div>
</div>

<div class="stat-grid">
  <div class="stat-card">
    <div class="stat-icon"><i class="fas fa-wallet"></i></div>
    <div class="stat-meta">
      <div class="stat-label">Total Outcome for {{ dt.ctime()[4:7] }} {{ dt.ctime()[20:24] }}</div>
      <div class="stat-value">{{ "Rp{:,.2f}".format(totalout) }}</div>
    </div>
  </div>
</div>

<button class="scroll-to-top-button" onclick="scrollToTop()">
  <i class="fas fa-arrow-up"></i>
</button>
{% endblock %}
